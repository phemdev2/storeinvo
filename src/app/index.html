// ===== TOAST SYSTEM =====
function toast(msg, type='success') {
  const c = $('#toast-container');
  const colors = { success:'border-l-4 border-green-500', error:'border-l-4 border-red-500', info:'border-l-4 border-blue-500', warning:'border-l-4 border-yellow-500' };
  const icons = { success:'check-circle', error:'x-circle', info:'info', warning:'alert-triangle' };
  const el = document.createElement('div');
  el.className = `toast-enter pointer-events-auto ${colors[type]} rounded-xl p-4 shadow-lg flex items-center gap-3`;
  el.style.cssText = `background:var(--card);border:1px solid var(--border)`;
  el.innerHTML = `<i data-lucide="${icons[type]}" class="w-5 h-5 flex-shrink-0" style="color:var(--accent)"></i><span class="text-sm font-medium" style="color:var(--text)">${msg}</span>`;
  c.appendChild(el);
  lucide.createIcons({nodes:[el]});
  setTimeout(() => { el.classList.replace('toast-enter','toast-exit'); setTimeout(() => el.remove(), 300); }, 3000);
}

// ===== STAR RATING HTML =====
function stars(r, size='w-4 h-4') {
  let h = '';
  for (let i = 1; i <= 5; i++) {
    if (i <= Math.floor(r)) h += `<i data-lucide="star" class="${size} fill-gold-500 text-gold-500"></i>`;
    else if (i - r < 1) h += `<i data-lucide="star" class="${size} fill-gold-500 text-gold-500 opacity-60"></i>`;
    else h += `<i data-lucide="star" class="${size} text-gray-300 dark:text-gray-600"></i>`;
  }
  return h;
}

// ===== CART LOGIC =====
function addToCart(id, color=null, size=null, qty=1) {
  const p = PRODUCTS.find(x=>x.id===id);
  if (!p) return;
  const key = `${id}-${color||''}-${size||''}`;
  const existing = S.cart.find(x=>x.key===key);
  if (existing) { existing.qty += qty; }
  else { S.cart.push({ key, id, color, size, qty, price: p.price }); }
  saveCart();
  updateCartBadge();
  toast(`${p.name} added to cart`);
}
function quickAdd(id) { addToCart(id); }
function removeFromCart(key) {
  S.cart = S.cart.filter(x=>x.key!==key);
  saveCart(); updateCartBadge();
  if (S.page==='cart') renderPage();
  toast('Item removed from cart','info');
}
function updateQty(key, qty) {
  const item = S.cart.find(x=>x.key===key);
  if (item) { item.qty = Math.max(1, qty); saveCart(); if(S.page==='cart') renderPage(); }
}
function getCartSubtotal() { return S.cart.reduce((s,i)=>s+i.price*i.qty, 0); }
function getCartCount() { return S.cart.reduce((s,i)=>s+i.qty, 0); }
function saveCart() { localStorage.setItem('luxe_cart', JSON.stringify(S.cart)); }
function loadCart() { try { S.cart = JSON.parse(localStorage.getItem('luxe_cart')) || []; } catch(e) { S.cart = []; } }
function updateCartBadge() {
  const c = getCartCount();
  $$('#cart-badge').forEach(el => { el.textContent = c; el.style.display = c > 0 ? 'flex' : 'none'; });
}

// ===== WISHLIST LOGIC =====
function toggleWishlist(id) {
  const i = S.wishlist.indexOf(id);
  if (i > -1) { S.wishlist.splice(i, 1); toast('Removed from wishlist','info'); }
  else { S.wishlist.push(id); toast('Added to wishlist'); }
  localStorage.setItem('luxe_wish', JSON.stringify(S.wishlist));
  renderPage();
}
function loadWishlist() { try { S.wishlist = JSON.parse(localStorage.getItem('luxe_wish')) || []; } catch(e) { S.wishlist = []; } }

// ===== DARK MODE =====
function toggleDark() {
  S.dark = !S.dark;
  document.documentElement.classList.toggle('dark', S.dark);
  localStorage.setItem('luxe_dark', S.dark);
  renderHeader(); renderMobileNav();
}
function loadDark() {
  S.dark = localStorage.getItem('luxe_dark') === 'true' || (!localStorage.getItem('luxe_dark') && window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.classList.toggle('dark', S.dark);
}

  const r = $('#search-results');
  if (!q.trim()) { openSearch(); return; }
  const results = PRODUCTS.filter(p => p.name.toLowerCase().includes(q.toLowerCase()) || p.category.includes(q.toLowerCase()));
  if (!results.length) { r.innerHTML = `<div class="text-center py-12"><i data-lucide="search-x" class="w-12 h-12 mx-auto mb-3" style="color:var(--text-muted)"></i><p class="font-medium" style="color:var(--text)">No results found</p><p class="text-sm mt-1" style="color:var(--text-muted)">Try a different search term</p></div>`; lucide.createIcons({nodes:[r]}); return; }

function handleLogin() {

  S.user = { name: email.split('@')[0], email, avatar: `https://i.pravatar.cc/100?img=${Math.floor(Math.random()*70)}` };

  renderHeader(); renderMobileNav();
}
function handleRegister() {
  const name = $('#auth-name')?.value, email = $('#auth-email')?.value;

  S.user = { name, email, avatar: `https://i.pravatar.cc/100?img=${Math.floor(Math.random()*70)}` };
  closeAuth(); toast('Account created successfully!');
  renderHeader(); renderMobileNav();
}

// ===== NAVIGATION =====
function navigate(page, params={}) {
  S.page = page; S.params = params;
  renderPage(); renderHeader(); renderMobileNav();
  window.scrollTo({top:0, behavior:'smooth'});
}

// ===== MAIN RENDER =====
function renderPage() {
  const c = $('#page-container');
  switch(S.page) {
    case 'home': c.innerHTML = renderHome(); break;
    case 'products': c.innerHTML = renderProducts(); break;
    case 'product': c.innerHTML = renderProduct(); break;
    case 'cart': c.innerHTML = renderCartPage(); break;
    case 'checkout': c.innerHTML = renderCheckout(); break;
    case 'account': c.innerHTML = renderAccount(); break;
    case 'admin': c.innerHTML = renderAdmin(); break;
    default: c.innerHTML = renderHome();
  }
  lucide.createIcons();
  initReveal();
  if (S.page === 'admin' && S.adminTab === 'overview') initCharts();
}

// ===== PRODUCTS PAGE =====
function renderProducts() {
  const cat = S.params.category || S.filters.category;
  let filtered = [...PRODUCTS];
  if (cat) filtered = filtered.filter(p => p.category === cat);
  const q = S.params.search;
  if (q) filtered = filtered.filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
  filtered = filtered.filter(p => p.price >= S.filters.minPrice && p.price <= S.filters.maxPrice);
  if (S.filters.inStock) filtered = filtered.filter(p => p.stock > 0);
  const sort = S.params.sort || S.filters.sort;
  if (sort === 'price-low') filtered.sort((a,b)=>a.price-b.price);
  else if (sort === 'price-high') filtered.sort((a,b)=>b.price-a.price);
  else if (sort === 'rating') filtered.sort((a,b)=>b.rating-a.rating);
  else filtered.sort((a,b)=>b.reviews-a.reviews);
  const perPage = S.productsPerPage;
  const totalPages = Math.ceil(filtered.length / perPage);
  const page = S.productPage;
  const paged = filtered.slice((page-1)*perPage, page*perPage);
  const catName = cat ? CATEGORIES.find(c=>c.id===cat)?.name : 'All Products';
  return `
  <div class="max-w-7xl mx-auto px-4 py-6">
    <!-- Breadcrumb -->
    <div class="flex items-center gap-2 text-sm mb-6" style="color:var(--text-muted)">

    <div class="flex flex-col lg:flex-row gap-6">

      <aside class="lg:w-64 flex-shrink-0">

          <div class="rounded-2xl p-5" style="background:var(--card);border:1px solid var(--border)">
            <h3 class="font-display font-semibold text-sm mb-4" style="color:var(--text)">Categories</h3>
            <div class="space-y-2">
              <button onclick="S.filters.category='';S.productPage=1;navigate('products')" class="w-full text-left text-sm py-2 px-3 rounded-lg transition-colors ${!cat?'font-semibold':'hover:bg-elevated dark:hover:bg-elevated-dark'}" style="color:${!cat?'var(--accent)':'var(--text)'}">All Products</button>
              ${CATEGORIES.map(c=>`<button onclick="S.filters.category='${c.id}';S.productPage=1;navigate('products',{category:'${c.id}'})" class="w-full text-left text-sm py-2 px-3 rounded-lg transition-colors flex items-center justify-between ${cat===c.id?'font-semibold':'hover:bg-elevated dark:hover:bg-elevated-dark'}" style="color:${cat===c.id?'var(--accent)':'var(--text)'}"><span>${c.name}</span><span class="text-xs" style="color:var(--text-muted)">${c.count}</span></button>`).join('')}
            </div>
          </div>
          <div class="rounded-2xl p-5" style="background:var(--card);border:1px solid var(--border)">
            <h3 class="font-display font-semibold text-sm mb-4" style="color:var(--text)">Price Range</h3>
            <div class="flex items-center gap-2">
              <input type="number" value="${S.filters.minPrice}" onchange="S.filters.minPrice=+this.value;S.productPage=1;renderPage()" class="w-full px-3 py-2 rounded-lg text-sm" style="background:var(--bg);color:var(--text);border:1px solid var(--border)" placeholder="Min">
              <span style="color:var(--text-muted)">-</span>
              <input type="number" value="${S.filters.maxPrice}" onchange="S.filters.maxPrice=+this.value;S.productPage=1;renderPage()" class="w-full px-3 py-2 rounded-lg text-sm" style="background:var(--bg);color:var(--text);border:1px solid var(--border)" placeholder="Max">
            </div>
          </div>
          <div class="rounded-2xl p-5" style="background:var(--card);border:1px solid var(--border)">
            <label class="flex items-center gap-3 cursor-pointer">
              <input type="checkbox" ${S.filters.inStock?'checked':''} onchange="S.filters.inStock=this.checked;S.productPage=1;renderPage()" class="w-4 h-4 rounded accent-coral-600">
              <span class="text-sm" style="color:var(--text)">In Stock Only</span>
            </label>
          </div>
        </div>
      </aside>
      <!-- Products Grid -->
      <div class="flex-1">
        <div class="flex items-center justify-between mb-6">
          <p class="text-sm" style="color:var(--text-muted)">${filtered.length} products found</p>
          <select onchange="S.filters.sort=this.value;S.productPage=1;renderPage()" class="px-3 py-2 rounded-lg text-sm" style="background:var(--card);color:var(--text);border:1px solid var(--border)">
            <option value="popular" ${sort==='popular'?'selected':''}>Most Popular</option>
            <option value="price-low" ${sort==='price-low'?'selected':''}>Price: Low to High</option>

            <option value="rating" ${sort==='rating'?'selected':''}>Highest Rated</option>
          </select>
        </div>
        ${paged.length ? `<div class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">${paged.map((p,i)=>productCard(p,i*60)).join('')}</div>` :
        `<div class="text-center py-20"><i data-lucide="package-x" class="w-16 h-16 mx-auto mb-4" style="color:var(--border)"></i><p class="font-display font-semibold text-lg mb-1" style="color:var(--text)">No products found</p><p class="text-sm" style="color:var(--text-muted)">Try adjusting your filters</p></div>`}
        ${totalPages > 1 ? `<div class="flex items-center justify-center gap-2 mt-8">
          ${Array.from({length:totalPages},(_,i)=>i+1).map(p=>`<button onclick="S.productPage=${p};renderPage()" class="w-10 h-10 rounded-lg text-sm font-medium transition-colors ${p===page?'text-white':'hover:bg-elevated dark:hover:bg-elevated-dark'}" style="${p===page?'background:var(--accent)':'color:var(--text);border:1px solid var(--border)'}">${p}</button>`).join('')}
        </div>` : ''}
      </div>
    </div>
  </div>`;
}

function renderProduct() {
  const p = PRODUCTS.find(x=>x.id===S.params.id);
  if (!p) return `<div class="max-w-7xl mx-auto px-4 py-20 text-center"><p class="font-display font-bold text-xl" style="color:var(--text)">Product not found</p></div>`;
  const related = PRODUCTS.filter(x=>x.category===p.category && x.id!==p.id).slice(0,4);
  const disc = p.originalPrice > p.price ? discount(p.originalPrice, p.price) : 0;
  return `
  <div class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex items-center gap-2 text-sm mb-6" style="color:var(--text-muted)">
      <button onclick="navigate('home')" class="hover:text-coral-600 transition-colors">Home</button><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
      <button onclick="navigate('products',{category:'${p.category}'})" class="hover:text-coral-600 transition-colors">${CATEGORIES.find(c=>c.id===p.category)?.name}</button><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
      <span style="color:var(--text)" class="font-medium line-clamp-1">${p.name}</span>
    </div>
    <div class="grid lg:grid-cols-2 gap-8 lg:gap-12 mb-16">
      <!-- Gallery -->
      <div class="anim-fade-up">
        <div class="rounded-2xl overflow-hidden aspect-square mb-4" style="background:var(--card);border:1px solid var(--border)">
          <img id="main-product-img" src="${p.images[0]}" alt="${p.name}" class="w-full h-full object-cover">
        </div>
        ${p.images.length > 1 ? `<div class="flex gap-3 overflow-x-auto hide-scrollbar">${p.images.map((img,i)=>`<button onclick="document.getElementById('main-product-img').src='${img}'" class="flex-shrink-0 w-20 h-20 rounded-xl overflow-hidden transition-all" style="border:2px solid ${i===0?'var(--accent)':'var(--border)'}"><img src="${img}" class="w-full h-full object-cover" loading="lazy"></button>`).join('')}</div>` : ''}
      </div>
      <!-- Info -->
      <div class="anim-fade-up" style="animation-delay:150ms">
        ${p.badge ? `<span class="inline-block text-xs font-bold px-3 py-1 rounded-full mb-3 ${p.badge==='Sale'||p.badge==='Hot'?'bg-coral-600 text-white':p.badge==='New'?'bg-mint-600 text-white':'bg-gold-500 text-gray-900'}">${p.badge}</span>` : ''}
        <h1 class="font-display font-bold text-2xl md:text-3xl mb-3" style="color:var(--text)">${p.name}</h1>
        <div class="flex items-center gap-3 mb-4">
          <div class="flex items-center gap-1">${stars(p.rating)}</div>
          <span class="text-sm font-medium" style="color:var(--text)">${p.rating}</span>
          <span class="text-sm" style="color:var(--text-muted)">(${p.reviews.toLocaleString()} reviews)</span>
        </div>
        <div class="flex items-baseline gap-3 mb-6">
          <span class="font-display font-bold text-3xl" style="color:var(--text)">${fmt(p.price)}</span>
          ${p.originalPrice > p.price ? `<span class="text-lg line-through" style="color:var(--text-muted)">${fmt(p.originalPrice)}</span><span class="text-sm font-bold px-2 py-0.5 rounded-full bg-red-500 text-white">-${disc}%</span>` : ''}
        </div>
        <p class="text-sm leading-relaxed mb-6" style="color:var(--text-muted)">${p.description}</p>
        <!-- Colors -->
        ${p.colors.length ? `<div class="mb-6"><p class="text-sm font-semibold mb-3" style="color:var(--text)">Color</p><div class="flex gap-2" id="color-options">${p.colors.map((c,i)=>`<button onclick="selectColor(this,'${c}')" class="w-10 h-10 rounded-full transition-all ${i===0?'ring-2 ring-offset-2 ring-coral-600':''}" style="background:${c};ring-offset-color:var(--bg)"></button>`).join('')}</div></div>` : ''}
        <!-- Sizes -->
        ${p.sizes.length ? `<div class="mb-6"><p class="text-sm font-semibold mb-3" style="color:var(--text)">Size</p><div class="flex flex-wrap gap-2" id="size-options">${p.sizes.map((s,i)=>`<button onclick="selectSize(this,'${s}')" class="px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${i===0?'':'hover:border-coral-600'}" style="background:var(--bg);color:var(--text);border:${i===0?'2px solid var(--accent)':'1px solid var(--border)'}">${s}</button>`).join('')}</div></div>` : ''}
        <!-- Quantity -->
        <div class="mb-6"><p class="text-sm font-semibold mb-3" style="color:var(--text)">Quantity</p>
          <div class="inline-flex items-center rounded-xl overflow-hidden" style="border:1px solid var(--border)">
            <button onclick="let q=document.getElementById('qty-input');q.value=Math.max(1,+q.value-1)" class="w-11 h-11 flex items-center justify-center hover:bg-elevated dark:hover:bg-elevated-dark"><i data-lucide="minus" class="w-4 h-4" style="color:var(--text-muted)"></i></button>
            <input id="qty-input" type="number" value="1" min="1" max="${p.stock}" class="w-14 h-11 text-center text-sm font-medium" style="background:transparent;color:var(--text);border:none;border-left:1px solid var(--border);border-right:1px solid var(--border)">
            <button onclick="let q=document.getElementById('qty-input');q.value=Math.min(${p.stock},+q.value+1)" class="w-11 h-11 flex items-center justify-center hover:bg-elevated dark:hover:bg-elevated-dark"><i data-lucide="plus" class="w-4 h-4" style="color:var(--text-muted)"></i></button>
          </div>
          <span class="text-xs ml-3" style="color:var(--text-muted)">${p.stock} in stock</span>
        </div>
        <!-- Actions -->
        <div class="flex gap-3 mb-6">
          <button onclick="addProductToCart(${p.id})" class="btn-primary flex-1 flex items-center justify-center gap-2 py-4 text-base" style="animation:pulse-glow 2s infinite"><i data-lucide="shopping-bag" class="w-5 h-5"></i> Add to Cart</button>
          <button onclick="toggleWishlist(${p.id})" class="w-14 h-14 rounded-2xl flex items-center justify-center transition-all" style="border:1px solid var(--border)" aria-label="Add to wishlist">
            <i data-lucide="heart" class="w-5 h-5 ${S.wishlist.includes(p.id)?'fill-coral-600 text-coral-600':''}" style="${S.wishlist.includes(p.id)?'':'color:var(--text-muted)'}"></i>
          </button>
        </div>
        <!-- Specs -->
        ${p.specs ? `<div class="rounded-2xl p-5" style="background:var(--bg);border:1px solid var(--border)">
          <h3 class="font-display font-semibold text-sm mb-3" style="color:var(--text)">Specifications</h3>
          <div class="grid grid-cols-2 gap-2">${p.specs.map(s=>`<div class="flex items-center gap-2"><i data-lucide="check" class="w-3.5 h-3.5 text-mint-500"></i><span class="text-sm" style="color:var(--text-muted)">${s}</span></div>`).join('')}</div>
        </div>` : ''}
      </div>
    </div>
    <!-- Reviews -->
    <section class="mb-16 reveal">
      <h2 class="font-display font-bold text-2xl mb-6" style="color:var(--text)">Customer Reviews</h2>
      <div class="grid md:grid-cols-2 gap-4">
        ${REVIEWS.map(r=>`<div class="rounded-2xl p-5" style="background:var(--card);border:1px solid var(--border)">
          <div class="flex items-center justify-between mb-3"><div class="flex items-center gap-1">${stars(r.rating,'w-4 h-4')}</div><span class="text-xs" style="color:var(--text-muted)">${r.date}</span></div>
          <p class="text-sm leading-relaxed mb-3" style="color:var(--text)">"${r.text}"</p>
          <div class="flex items-center gap-3"><img src="${r.avatar}" class="w-8 h-8 rounded-full object-cover"><span class="text-sm font-medium" style="color:var(--text)">${r.user}</span></div>
        </div>`).join('')}
      </div>
    </section>
    <!-- Related -->
    ${related.length ? `<section class="mb-8 reveal"><h2 class="font-display font-bold text-2xl mb-6" style="color:var(--text)">You Might Also Like</h2><div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">${related.map((p,i)=>productCard(p,i*80)).join('')}</div></section>` : ''}
  </div>`;
}
function selectColor(el, c) {
  $$('#color-options button').forEach(b => { b.style.outline = 'none'; b.classList.remove('ring-2','ring-offset-2','ring-coral-600'); });
  el.classList.add('ring-2','ring-offset-2','ring-coral-600');
}
function selectSize(el, s) {
  $$('#size-options button').forEach(b => { b.style.border = '1px solid var(--border)'; b.style.fontWeight = '500'; });
  el.style.border = '2px solid var(--accent)';
  el.style.fontWeight = '600';
}
function addProductToCart(id) {
  const qty = parseInt($('#qty-input')?.value || 1);
  const colorEl = $('#color-options button.ring-2');
  const sizeEl = $('#size-options button[style*="2px solid var(--accent)"]');
  const color = colorEl ? colorEl.style.background : null;
  const size = sizeEl ? sizeEl.textContent.trim() : null;
  addToCart(id, color, size, qty);
}

// ===== CART PAGE =====
function renderCartPage() {
  const sub = getCartSubtotal();
  const shipping = sub >= 50 ? 0 : 4.99;
  return `
  <div class="max-w-5xl mx-auto px-4 py-6">
    <h1 class="font-display font-bold text-2xl mb-6" style="color:var(--text)">Shopping Cart</h1>
    ${S.cart.length === 0 ? `<div class="text-center py-20 rounded-2xl" style="background:var(--card);border:1px solid var(--border)">
      <i data-lucide="shopping-bag" class="w-20 h-20 mx-auto mb-4" style="color:var(--border)"></i>
      <p class="font-display font-semibold text-xl mb-2" style="color:var(--text)">Your cart is empty</p>
      <p class="text-sm mb-6" style="color:var(--text-muted)">Looks like you haven't added anything yet</p>
      <button onclick="navigate('products')" class="btn-primary">Start Shopping</button>
    </div>` : `
    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-4">
        ${S.cart.map(item => { const p = PRODUCTS.find(x=>x.id===item.id); if(!p) return ''; return `
        <div class="flex gap-4 p-4 rounded-2xl" style="background:var(--card);border:1px solid var(--border)">
          <img src="${p.image}" class="w-24 h-24 md:w-28 md:h-28 rounded-xl object-cover flex-shrink-0 cursor-pointer" onclick="navigate('product',{id:${p.id}})">
          <div class="flex-1 min-w-0">
            <h3 class="font-medium text-sm md:text-base line-clamp-1 mb-1 cursor-pointer hover:text-coral-600" style="color:var(--text)" onclick="navigate('product',{id:${p.id}})">${p.name}</h3>
            ${item.color ? `<div class="flex items-center gap-1.5 mb-1"><span class="w-4 h-4 rounded-full border" style="background:${item.color};border-color:var(--border)"></span><span class="text-xs" style="color:var(--text-muted)">Selected</span></div>` : ''}
            ${item.size ? `<p class="text-xs mb-1" style="color:var(--text-muted)">Size: ${item.size}</p>` : ''}
            <p class="font-display font-bold mt-2" style="color:var(--text)">${fmt(item.price)}</p>
            <div class="flex items-center justify-between mt-3">
              <div class="flex items-center rounded-lg overflow-hidden" style="border:1px solid var(--border)">
                <button onclick="updateQty('${item.key}',${item.qty-1})" class="w-8 h-8 flex items-center justify-center hover:bg-elevated dark:hover:bg-elevated-dark"><i data-lucide="minus" class="w-3.5 h-3.5" style="color:var(--text-muted)"></i></button>
                <span class="w-10 text-center text-sm font-medium" style="color:var(--text)">${item.qty}</span>
                <button onclick="updateQty('${item.key}',${item.qty+1})" class="w-8 h-8 flex items-center justify-center hover:bg-elevated dark:hover:bg-elevated-dark"><i data-lucide="plus" class="w-3.5 h-3.5" style="color:var(--text-muted)"></i></button>
              </div>
              <button onclick="removeFromCart('${item.key}')" class="text-sm font-medium text-red-500 hover:text-red-600 flex items-center gap-1"><i data-lucide="trash-2" class="w-4 h-4"></i>Remove</button>
            </div>
          </div>
        </div>`; }).join('')}
      </div>
      <div>
        <div class="rounded-2xl p-6 sticky top-20" style="background:var(--card);border:1px solid var(--border)">
          <h3 class="font-display font-semibold mb-4" style="color:var(--text)">Order Summary</h3>
          <div class="space-y-3 mb-4">
            <div class="flex justify-between text-sm"><span style="color:var(--text-muted)">Subtotal</span><span style="color:var(--text)">${fmt(sub)}</span></div>
            <div class="flex justify-between text-sm"><span style="color:var(--text-muted)">Shipping</span><span style="color:${shipping===0?'var(--mint)':'var(--text)'}">${shipping===0?'Free':fmt(shipping)}</span></div>
            <div class="flex justify-between text-sm"><span style="color:var(--text-muted)">Tax (estimated)</span><span style="color:var(--text)">${fmt(sub*0.08)}</span></div>
          </div>
          <div class="h-px mb-4" style="background:var(--border)"></div>
          <div class="flex justify-between mb-6"><span class="font-display font-semibold" style="color:var(--text)">Total</span><span class="font-display font-bold text-xl" style="color:var(--text)">${fmt(sub+shipping+sub*0.08)}</span></div>
          <!-- Promo -->
          <div class="flex gap-2 mb-4">
            <input id="promo-input" type="text" placeholder="Promo code" class="flex-1 px-4 py-2.5 rounded-xl text-sm" style="background:var(--bg);color:var(--text);border:1px solid var(--border)">
            <button onclick="applyPromo()" class="px-4 py-2.5 rounded-xl text-sm font-medium" style="background:var(--bg);color:var(--text);border:1px solid var(--border)">Apply</button>
          </div>
          <button onclick="navigate('checkout')" class="btn-primary w-full py-4">Proceed to Checkout</button>
          <button onclick="navigate('products')" class="w-full text-center text-sm font-medium py-3" style="color:var(--accent)">Continue Shopping</button>
        </div>
      </div>
    </div>`}
  </div>`;
}
function applyPromo() {
  const code = $('#promo-input')?.value?.trim().toUpperCase();
  if (code === 'LUXE10') { toast('Promo code applied! 10% off'); }
  else if (code) { toast('Invalid promo code','error'); }
}

// ===== CHECKOUT PAGE =====
function renderCheckout() {
  if (S.cart.length === 0) { navigate('cart'); return ''; }
  const sub = getCartSubtotal();
  const shipping = sub >= 50 ? 0 : 4.99;
  const steps = ['Shipping','Payment','Review'];
  return `
  <div class="max-w-5xl mx-auto px-4 py-6">
    <h1 class="font-display font-bold text-2xl mb-6" style="color:var(--text)">Checkout</h1>
    <!-- Steps -->
    <div class="flex items-center gap-2 mb-8 overflow-x-auto hide-scrollbar">
      ${steps.map((s,i)=>`<div class="flex items-center gap-2 flex-shrink-0">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${i<=S.checkoutStep?'text-white':''}" style="${i<=S.checkoutStep?'background:var(--accent)':'background:var(--bg);color:var(--text-muted);border:1px solid var(--border)'}">${i<S.checkoutStep?'<i data-lucide="check" class="w-4 h-4"></i>':i+1}</div>
        <span class="text-sm font-medium hidden sm:inline" style="color:${i<=S.checkoutStep?'var(--text)':'var(--text-muted)'}">${s}</span>
        ${i<2?`<div class="w-8 md:w-16 h-0.5 rounded-full" style="background:${i<S.checkoutStep?'var(--accent)':'var(--border)'}"></div>`:''}
      </div>`).join('')}
    </div>
    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2">
        ${S.checkoutStep === 0 ? `
        <div class="rounded-2xl p-6" style="background:var(--card);border:1px solid var(--border)">
          <h2 class="font-display font-semibold text-lg mb-6" style="color:var(--text)">Shipping Address</h2>
          <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2 sm:col-span-1"><label class="block text-sm font-medium mb-1.5" style="color:var(--text)">First Name</label><input type="text" value="John" class="w-full px-4 py-3 rounded-xl text-sm" style="background:var(--bg);color:var(--text);border:1px solid var(--border)"></div>
            <div class="col-span-2 sm:col-span-1"><label class="block text-sm font-medium mb-1.5" style="color:var(--text)">Last Name</label><input type="text" value="Doe" class="w-full px-4 py-3 rounded-xl text-sm" style="background:var(--bg);color:var(--text);border:1px solid var(--border)"></div>
            <div class="col-span-2"><label class="block text-sm font-medium mb-1.5" style="color:var(--text)">Address</label><input type="text" value="123 Main Street" class="w-full px-4 py-3 rounded-xl text-sm" style="background:var(--bg);color:var(--text);border:1px solid var(--border)"></div>
            <div class="col-span-2 sm:col-span-1"><label class="block text-sm font-medium mb-1.5" style="color:var(--text)">City</label><input type="text" value="New York" class="w-full px-4 py-3 rounded-xl text-sm" style="background:var(--bg);color:var(--text);border:1px solid var(--border)"></div>
            <div class="col-span-2 sm:col-span-1"><label class="block text-sm font-medium mb-1.5" style="color:var(--text)">Postal Code</label><input type="text" value="10001" class="w-full px-4 py-3 rounded-xl text-sm" style="background:var(--bg);color:var(--text);border:1px solid var(--border)"></div><div class="col-span-2 sm:col-span-1"><label class="block text-sm font-medium mb-1.5" style="color:var(--text)">ZIP Code</label><input type="text" value="10001" class="w-full px-4 py-3 rounded-xl text-sm" style="background:var(--bg);color:var(--text);border:1px solid var(--border)"></div>
            <div class="col-span-2 sm:col-span-1"><label class="block text-sm font-medium mb-1.5" style="color:var(--text)">Phone</label><input type="tel" value="+1 (555) 123-4567" class="w-full px-4 py-3 rounded-xl text-sm" style="background:var(--bg);color:var(--text);border:1px solid var(--border)"></div>
          </div>
          <div class="flex items-center gap-3 mt-6">
            <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="w-4 h-4 rounded accent-coral-600"><span class="text-sm" style="color:var(--text-muted)">Save this address</span></label>
          </div>
          <button onclick="S.checkoutStep=1;renderPage()" class="btn-primary mt-6">Continue to Payment</button>
        </div>` : S.checkoutStep === 1 ? `
        <div class="rounded-2xl p-6" style="background:var(--card);border:1px solid var(--border)">
          <h2 class="font-display font-semibold text-lg mb-6" style="color:var(--text)">Payment Method</h2>
          <div class="space-y-3 mb-6">
            ${[{id:'card',icon:'credit-card',t:'Credit / Debit Card',sub:'Visa, Mastercard, Amex'},{id:'paypal',icon:'wallet',t:'PayPal',sub:'Pay with your PayPal account'},{id:'apple',icon:'smartphone',t:'Apple Pay',sub:'Quick and secure'}].map((m,i)=>`
            <label class="flex items-center gap-4 p-4 rounded-xl cursor-pointer transition-all" style="background:${i===0?'rgba(232,85,58,.05)':'var(--bg)'};border:${i===0?'2px solid var(--accent)':'1px solid var(--border)'}">
              <input type="radio" name="payment" ${i===0?'checked':''} class="w-4 h-4 accent-coral-600">
              <i data-lucide="${m.icon}" class="w-5 h-5" style="color:var(--text-muted)"></i>
              <div><p class="text-sm font-medium" style="color:var(--text)">${m.t}</p><p class="text-xs" style="color:var(--text-muted)">${m.sub}</p></div>
            </label>`).join('')}
          </div>
          <div class="space-y-4 mb-6">
            <div><label class="block text-sm font-medium mb-1.5" style="color:var(--text)">Card Number</label><input type="text" placeholder="4242 4242 4242 4242" class="w-full px-4 py-3 rounded-xl text-sm" style="background:var(--bg);color:var(--text);border:1px solid var(--border)"></div>
            <div class="grid grid-cols-2 gap-4">
              <div><label class="block text-sm font-medium mb-1.5" style="color:var(--text)">Expiry Date</label><input type="text" placeholder="MM/YY" class="w-full px-4 py-3 rounded-xl text-sm" style="background:var(--bg);color:var(--text);border:1px solid var(--border)"></div>
              <div><label class="block text-sm font-medium mb-1.5" style="color:var(--text)">CVV</label><input type="text" placeholder="123" class="w-full px-4 py-3 rounded-xl text-sm" style="background:var(--bg);color:var(--text);border:1px solid var(--border)"></div>
            </div>
          </div>
          <div class="flex gap-3">
            <button onclick="S.checkoutStep=0;renderPage()" class="btn-outline flex-1">Back</button>
            <button onclick="S.checkoutStep=2;renderPage()" class="btn-primary flex-1">Review Order</button>
          </div>
        </div>` : `
        <!-- Order Review -->
        <div class="rounded-2xl p-6 mb-4" style="background:var(--card);border:1px solid var(--border)">
          <h2 class="font-display font-semibold text-lg mb-4" style="color:var(--text)">Order Review</h2>
          <div class="space-y-3 mb-4">
            ${S.cart.map(item => { const p = PRODUCTS.find(x=>x.id===item.id); if(!p) return ''; return `
            <div class="flex items-center gap-3">
              <img src="${p.image}" class="w-14 h-14 rounded-lg object-cover">
              <div class="flex-1 min-w-0"><p class="text-sm font-medium line-clamp-1" style="color:var(--text)">${p.name}</p><p class="text-xs" style="color:var(--text-muted)">Qty: ${item.qty}${item.size?' / Size: '+item.size:''}</p></div>
              <span class="text-sm font-semibold" style="color:var(--text)">${fmt(item.price*item.qty)}</span>
            </div>`; }).join('')}
          </div>
          <div class="rounded-xl p-4" style="background:var(--bg)">
            <div class="flex items-center gap-2 mb-2"><i data-lucide="map-pin" class="w-4 h-4" style="color:var(--accent)"></i><span class="text-sm font-medium" style="color:var(--text)">123 Main Street, New York, NY 10001</span></div>
            <div class="flex items-center gap-2"><i data-lucide="credit-card" class="w-4 h-4" style="color:var(--accent)"></i><span class="text-sm" style="color:var(--text-muted)">Credit Card ending in 4242</span></div>
          </div>
        </div>
        <div class="flex gap-3">
          <button onclick="S.checkoutStep=1;renderPage()" class="btn-outline flex-1">Back</button>
          <button onclick="placeOrder()" class="btn-primary flex-1 py-4 flex items-center justify-center gap-2"><i data-lucide="lock" class="w-4 h-4"></i> Place Order</button>
        </div>`}
      </div>
      <!-- Order Summary Sidebar -->
      <div>
        <div class="rounded-2xl p-6 sticky top-20" style="background:var(--card);border:1px solid var(--border)">
          <h3 class="font-display font-semibold mb-4" style="color:var(--text)">Order Summary</h3>
          <div class="space-y-3 mb-4 max-h-48 overflow-y-auto">

          ${[{code:'LUXE10',disc:'10%',type:'Percentage',uses:'1,234/5000',active:true},{code:'WELCOME20',disc:'20%',type:'Percentage',uses:'567/1000',active:true},{code:'FREESHIP',disc:'$4.99',type:'Fixed',uses:'890/2000',active:true},{code:'SUMMER25',disc:'25%',type:'Percentage',uses:'0/3000',active:false}].map(c=>`
          <div class="rounded-2xl overflow-hidden" style="background:var(--card);border:1px solid var(--border)">
            <div class="p-5" style="background:${c.active?'linear-gradient(135deg,#E8553A,#F06B48)':'var(--bg)'}">
              <p class="font-display font-bold text-2xl text-white">${c.code}</p>
              <p class="text-white/80 text-sm mt-1">${c.disc} off — ${c.type}</p>
            </div>
            <div class="p-4 flex items-center justify-between">
              <span class="text-xs" style="color:var(--text-muted)">${c.uses} used</span>
              <span class="text-xs font-medium px-2 py-0.5 rounded-full ${c.active?'text-mint-600 bg-mint-50 dark:bg-mint-900/20':'text-red-500 bg-red-50 dark:bg-red-900/20'}">${c.active?'Active':'Inactive'}</span>
            </div>
          </div>`).join('')}
        </div>`;
      default: return '';
    }
  };
  return `<div class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-6">
      <div><h1 class="font-display font-bold text-2xl" style="color:var(--text)">Admin Dashboard</h1><p class="text-sm mt-1" style="color:var(--text-muted)">Manage your store</p></div>
      <button onclick="navigate('account')" class="btn-outline text-sm py-2 px-4 flex items-center gap-2"><i data-lucide="arrow-left" class="w-4 h-4"></i>Back to Account</button>
    </div>
    <div class="flex gap-1 overflow-x-auto hide-scrollbar mb-6 pb-1">
      ${tabs.map(t=>`<button onclick="S.adminTab='${t.id}';renderPage()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-colors ${S.adminTab===t.id?'text-white':'hover:bg-elevated dark:hover:bg-elevated-dark'}" style="${S.adminTab===t.id?'background:var(--accent)':'color:var(--text-muted)'}"><i data-lucide="${t.icon}" class="w-4 h-4"></i>${t.t}</button>`).join('')}
    </div>
    ${content()}
  </div>`;
}

// ===== CHARTS =====
function initCharts() {
  const isDark = S.dark;
  const gridColor = isDark ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.06)';
  const textColor = isDark ? '#9CA3AF' : '#6B7280';
  // Revenue Chart
  const rc = $('#revenueChart');
  if (rc) {
    new Chart(rc, {
      type: 'line',
      data: {
        labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
        datasets: [{
          label: 'Revenue',
          data: [8200,9400,7800,11200,13600,12100,15400,14200,16800,18200,16400,19500],
          borderColor: '#E8553A',
          backgroundColor: 'rgba(232,85,58,.1)',
          fill: true,
          tension: 0.4,
          borderWidth: 2.5,
          pointRadius: 0,
          pointHoverRadius: 6,
          pointHoverBackgroundColor: '#E8553A',
          pointHoverBorderColor: '#fff',
          pointHoverBorderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: textColor, font: { size: 11 } } },
          y: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 11 }, callback: v => '$' + (v/1000) + 'k' } }
        },
        interaction: { intersect: false, mode: 'index' }
      }
    });
  }
  // Category Chart
  const cc = $('#categoryChart');
  if (cc) {
    new Chart(cc, {
      type: 'doughnut',
      data: {
        labels: ['Electronics','Fashion','Home','Beauty','Sports'],
        datasets: [{
          data: [35, 25, 18, 14, 8],
          backgroundColor: ['#E8553A','#2DD4A8','#FBBF24','#8B5CF6','#3B82F6'],
          borderWidth: 0,
          hoverOffset: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '65%',
        plugins: {
          legend: { position: 'bottom', labels: { color: textColor, font: { size: 11 }, padding: 12, usePointStyle: true, pointStyleWidth: 8 } }
        }
      }
    });
  }
}

// ===== SCROLL REVEAL =====
function initReveal() {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  $$('.reveal').forEach(el => obs.observe(el));
}

// ===== FLASH SALE TIMER =====
function startFlashTimer() {
  const end = new Date();
  end.setHours(end.getHours() + 8, end.getMinutes() + 42, end.getSeconds() + 15);
  function tick() {
    const diff = Math.max(0, end - new Date());
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    const fh = $('#flash-h'), fm = $('#flash-m'), fs = $('#flash-s');
    if (fh) fh.textContent = String(h).padStart(2, '0');
    if (fm) fm.textContent = String(m).padStart(2, '0');
    if (fs) fs.textContent = String(s).padStart(2, '0');
    requestAnimationFrame(tick);
  }
  tick();
}

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSearch(); closeAuth(); closeCartDrawer(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openSearch(); }
});

// ===== INIT =====
function init() {
  loadDark();
  loadCart();
  loadWishlist();
  renderHeader();
  renderMobileNav();
  renderPage();
  updateCartBadge();
  startFlashTimer();
}
init();
</script>
